# Запуск в Docker на VPS:  docker compose up -d
# Консоль сервера:         docker attach rustcraft   (выход: Ctrl+P, Ctrl+Q)
services:
  bedrock:
    image: itzg/minecraft-bedrock-server
    container_name: rustcraft
    environment:
      EULA: "TRUE"
      VERSION: "LATEST"
      SERVER_NAME: "RustCraft | Выживание как в Rust"
      LEVEL_NAME: "RustCraft"
      GAMEMODE: "survival"
      FORCE_GAMEMODE: "true"
      DIFFICULTY: "normal"
      ALLOW_CHEATS: "false"
      MAX_PLAYERS: "30"
      VIEW_DISTANCE: "10"
      TICK_DISTANCE: "4"
      PLAYER_IDLE_TIMEOUT: "30"
      ALLOW_LIST: "false"
      ONLINE_MODE: "true"
      TEXTUREPACK_REQUIRED: "true"
    ports:
      - "19132:19132/udp"
    volumes:
      - ./data:/data
      - ./packs/RustCraft_BP:/data/behavior_packs/RustCraft_BP:ro
      - ./packs/RustCraft_RP:/data/resource_packs/RustCraft_RP:ro
      - ./server/worlds/RustCraft/world_behavior_packs.json:/data/worlds/RustCraft/world_behavior_packs.json:ro
      - ./server/worlds/RustCraft/world_resource_packs.json:/data/worlds/RustCraft/world_resource_packs.json:ro
    stdin_open: true
    tty: true
    restart: unless-stopped
